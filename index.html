<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>弹幕防线 · 修仙 v0.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;user-select:none}
#game{width:100%;max-width:420px;height:100dvh;position:relative;overflow:hidden;background:#0d0d1a}
canvas#main{width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s;pointer-events:auto}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{background:rgba(15,20,40,0.92);border:1px solid rgba(160,180,255,0.25);border-radius:10px;padding:20px 24px;width:84%;max-width:320px;box-shadow:0 4px 30px rgba(100,120,255,0.08)}
.panel-title{color:#b8c8ff;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px;margin-bottom:6px}
.panel-sub{color:#8890b0;font-size:12px;text-align:center;letter-spacing:2px;margin-bottom:14px;line-height:1.6}
.panel-deco{width:40px;height:1px;background:linear-gradient(90deg,transparent,#8098d0,transparent);margin:0 auto 12px}
.btn-gold{display:inline-block;padding:10px 32px;background:linear-gradient(135deg,#3a4a8a,#2a3a6a);border:1px solid #5a7ac0;border-radius:6px;color:#c8d8ff;font-size:15px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-gold:active{background:linear-gradient(135deg,#2a3a6a,#1a2a4a);transform:scale(0.96)}
.btn-ghost{display:inline-block;padding:6px 14px;border:1px solid #4a5a8a;border-radius:4px;background:transparent;color:#8890b0;font-size:12px;letter-spacing:2px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-ghost:active{background:rgba(80,100,180,0.1)}
.story-text{color:#5a4a3a;font-size:13px;line-height:2;text-align:center;white-space:pre-line;letter-spacing:1px}
.seal-btn{display:inline-block;padding:8px 28px;background:linear-gradient(135deg,#4a3060,#2a1a40);border:1px solid #8060a0;border-radius:4px;color:#d0c0e8;font-size:14px;font-weight:700;letter-spacing:6px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.seal-btn:active{background:linear-gradient(135deg,#3a2050,#1a0a30);transform:scale(0.96)}
/* Turret */
#turret-btn{position:absolute;left:6px;bottom:14%;z-index:10;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4a5a8a,#3a4a7a);border:1px solid #6080c0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.15s;box-shadow:0 2px 12px rgba(80,100,200,0.2);touch-action:none;pointer-events:auto}
#turret-btn:active{transform:scale(0.9);background:linear-gradient(135deg,#3a4a7a,#2a3a6a)}
#turret-cd{position:absolute;left:6px;bottom:14%;z-index:11;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;pointer-events:none}
/* Stun */
#stun-overlay{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(180,40,40,0)}
#stun-overlay.active{display:flex;background:rgba(100,30,60,0.2)}
#stun-text{color:#c06080;font-size:28px;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px #d04040;animation:stunPulse 0.3s alternate infinite}
@keyframes stunPulse{from{opacity:0.6;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
/* Wheel */
.wheel-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,10,0.8);display:none;align-items:center;justify-content:center}
.wheel-bg.active{display:flex}
#wheel-wrap{position:relative;width:min(240px,60vw);height:min(240px,60vw)}
#wheel-hint{position:absolute;top:8%;left:50%;transform:translateX(-50%);color:#8098d0;font-size:12px;letter-spacing:4px;z-index:25;display:none;text-align:center}
canvas#wheel-canvas{width:100%;height:100%}
#wheel-rating{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%) scale(0);pointer-events:none;z-index:30;transition:transform 0.1s cubic-bezier(0.34,1.56,0.64,1)}
#wheel-rating.show{transform:translate(-50%,-60%) scale(1)}
#wheel-rating span{font-size:40px;font-weight:700;letter-spacing:6px;text-shadow:0 0 40px currentColor}
/* Pages */
.page{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s}
.page.hidden{opacity:0;pointer-events:none}
.death-screen{z-index:60}
.win-screen{z-index:55}
/* Map */
.ch-node{display:flex;align-items:center;gap:12px;padding:12px 18px;border:1px solid #4a5a8a;border-radius:8px;background:rgba(15,20,40,0.7);cursor:pointer;transition:all 0.15s;width:100%}
.ch-node.active{border-color:#6080c0;background:rgba(20,30,60,0.8)}
.ch-node.locked{opacity:0.4;cursor:default}
.ch-node:not(.locked):active{background:rgba(60,80,140,0.15);border-color:#6a8ac0}
.ch-icon{font-size:30px;width:40px;text-align:center}
.ch-info{flex:1}
.ch-name{color:#a8b8e0;font-size:14px;font-weight:700;letter-spacing:2px}
.ch-desc{color:#7880a0;font-size:11px;letter-spacing:1px;margin-top:2px}
/* Upgrades */
.up-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #3a4a6a;border-radius:6px;background:rgba(15,20,40,0.5);cursor:pointer;transition:all 0.15s;margin-bottom:6px}
.up-item.maxed{opacity:0.5;cursor:default}
.up-item:not(.maxed):active{background:rgba(60,80,140,0.15)}
.up-ic{font-size:22px;width:30px;text-align:center}
.up-inner{flex:1}
.up-nm{color:#a8b8e0;font-size:13px;font-weight:600}
.up-desc{color:#7880a0;font-size:10px}
.up-lv{color:#5a6a90;font-size:11px}
.up-cost{color:#8098c0;font-size:12px;font-weight:700;min-width:30px;text-align:right}
.qi-text{color:#8098c0;font-size:16px;font-weight:700;letter-spacing:2px}
.qi-text span{color:#98b0d8;font-size:20px}

/* In-run 3-choice upgrade */
#run-upgrade{position:absolute;inset:0;z-index:58;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,0.72);backdrop-filter:blur(2px);pointer-events:auto}
#run-upgrade.active{display:flex}
.ru-card{width:86%;max-width:330px;background:rgba(12,18,36,0.96);border:1px solid rgba(150,190,255,0.35);border-radius:14px;padding:16px 14px;box-shadow:0 0 40px rgba(80,130,255,0.18)}
.ru-title{text-align:center;color:#c8d8ff;font-weight:700;font-size:18px;letter-spacing:5px;margin-bottom:4px}
.ru-sub{text-align:center;color:#7f8caf;font-size:11px;letter-spacing:2px;margin-bottom:12px}
.ru-options{display:flex;flex-direction:column;gap:8px}
.ru-option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid rgba(120,150,220,0.28);border-radius:10px;background:rgba(30,42,78,0.65)}
.ru-option:active{transform:scale(0.98);background:rgba(55,78,135,0.85)}
.ru-ic{font-size:24px;width:30px;text-align:center}.ru-nm{color:#d7e2ff;font-size:14px;font-weight:700}.ru-ds{color:#91a0c4;font-size:11px;margin-top:2px;line-height:1.35}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.4s ease-out both}
.fd1{animation-delay:0.1s}.fd2{animation-delay:0.25s}.fd3{animation-delay:0.4s}.fd4{animation-delay:0.55s}
</style>
</head>
<body>
<div id="game">
  <canvas id="main"></canvas>
  
  <!-- Turret -->
  <div id="turret-btn">✦</div>
  <div id="turret-cd"></div>

  <!-- Stun -->
  <div id="stun-overlay"><div id="stun-text">⚡ 破绽</div></div>

  <!-- Wheel -->
  <div id="wheel-hint">记住顺序 · 点击破招</div>
  <div class="wheel-bg" id="wheel-overlay">
    <div id="wheel-wrap"><canvas id="wheel-canvas"></canvas><div id="wheel-rating"><span></span></div></div>
  </div>

  <!-- Story intro -->
  <div id="page-story" class="page">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title">弹 幕 防 线</div>
      <div class="panel-sub">· 修 仙 篇 ·</div>
      <div class="story-text" style="margin-bottom:16px">
        天地玄黄·山海动荡
        上古凶兽冲破封印·涂炭人间

        你是一名清冷剑修
        独行于山海经的异兽世界
        以飞剑守护天地秩序
      </div>
      <div style="text-align:center"><button class="seal-btn" id="story-go">入 世</button></div>
    </div>
  </div>

  <!-- Menu -->
  <div id="page-menu" class="page hidden">
    <div class="fade-up fd1" style="font-size:42px;letter-spacing:12px;color:#b8c8ff;font-weight:700;margin-bottom:2px;text-shadow:0 0 30px rgba(150,180,255,0.2)">弹幕防线</div>
    <div class="fade-up fd2" style="font-size:12px;color:#7880a0;letter-spacing:8px;margin-bottom:24px">· 一 剑 一 念 ·</div>
    <div class="fade-up fd3" style="display:flex;flex-direction:column;gap:10px;align-items:center">
      <button class="btn-gold" id="m-start" style="min-width:160px">出 剑</button>
      <button class="btn-ghost" id="m-upgrade" style="min-width:140px">修 炼</button>
    </div>
    <div class="fade-up fd4" style="position:absolute;bottom:36px;color:#4a5a6a;font-size:10px;letter-spacing:3px">独立游戏 · 山海经 · 版本 v0.3</div>
  </div>

  <!-- Chapter -->
  <div id="page-chapter" class="page hidden">
    <div style="position:absolute;top:20px;left:12px"><button class="btn-ghost" id="ch-back">← 返回</button></div>
    <div class="panel-deco"></div>
    <div class="panel-sub" style="margin-bottom:16px;font-size:13px">选 择 战 场</div>
    <div id="ch-list" style="display:flex;flex-direction:column;gap:10px;width:84%;max-width:300px"></div>
  </div>

  <!-- Upgrade -->
  <div id="page-upgrade" class="page hidden">
    <div style="position:absolute;top:20px;left:12px"><button class="btn-ghost" id="up-back">← 返回</button></div>
    <div class="panel-deco"></div>
    <div class="qi-text fade-up fd1">灵气 · <span id="qi-amt">0</span></div>
    <div id="up-list" style="width:84%;max-width:300px;margin-top:12px"></div>
  </div>

  <!-- Wave story -->
  <div id="page-wave-story" class="page hidden" style="z-index:45">
    <div class="panel fade-up">
      <div class="story-text" id="ws-text"></div>
      <div style="text-align:center;margin-top:12px"><span class="btn-ghost" id="ws-next">继 续</span></div>
    </div>
  </div>



  <!-- In-run upgrade -->
  <div id="run-upgrade">
    <div class="ru-card fade-up">
      <div class="ru-title">道 法 选 择</div>
      <div class="ru-sub">三选一 · 立即生效</div>
      <div class="ru-options" id="ru-options"></div>
    </div>
  </div>

  <!-- Victory -->
  <div id="page-victory" class="page win-screen hidden">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title" style="color:#98b0d8">胜 利</div>
      <div id="v-chapter" style="color:#a8b8e0;font-size:14px;font-weight:700;letter-spacing:6px;margin:8px 0"></div>
      <div id="v-stats" style="color:#7880a0;font-size:12px;text-align:center;margin-bottom:6px;"></div>
      <div style="color:#8098c0;font-size:14px;font-weight:700;margin-bottom:14px">获得 <span id="v-qi" style="color:#98b0d8">0</span> 真气</div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
        <button class="btn-gold" id="v-retry" style="padding:8px 24px;font-size:13px">再战一次</button>
        <button class="btn-ghost" id="v-menu">返回主界面</button>
      </div>
    </div>
  </div>

  <!-- Death -->
  <div id="page-death" class="page death-screen hidden">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title" style="color:#c06080">败 北</div>
      <div id="d-reason" style="color:#7880a0;font-size:13px;margin:10px 0 16px;text-align:center"></div>
      <div id="d-stats" style="color:#6870a0;font-size:12px;text-align:center;margin-bottom:14px"></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
        <button class="btn-gold" id="d-retry" style="padding:8px 24px;font-size:13px">再试一次</button>
        <button class="btn-ghost" id="d-menu">返回主界面</button>
      </div>
    </div>
  </div>
</div>

// ===== CHARACTER ANIMATION =====
let pBob = 0;
let pWalkPhase = 0;
let pSwordPhase = 0;

function drawPlayerChar(ctx, px, py, r, s=1, stunned, rageOn){
  pBob += 0.04;
  pSwordPhase += 0.035;
  
  const sc = s * dp;
  const w = 78 * dp;
  const h = 148 * dp;
  
  // Detect if enemies are near → walk animation
  let nearEnemy = false;
  for(let e of en){if(e.y < py + 80){nearEnemy = true; break}}
  
  let targetAnim = 'idle';
  if(pst > 0) targetAnim = 'hit';
  if(ptm > 0) targetAnim = 'attack';
  if(nearEnemy && st === 'PLAYING') targetAnim = 'walk';
  
  // Calculate animation transforms
  let bobY = 0, swayX = 0, tiltA = 0, scaleX = 1;
  
  if(targetAnim === 'idle'){
    bobY = Math.sin(pBob) * 2 * sc;
    tiltA = Math.sin(pBob * 0.7) * 0.02;
  } else if(targetAnim === 'walk'){
    pWalkPhase += 0.1;
    bobY = Math.sin(pWalkPhase * 2) * 3 * sc;
    swayX = Math.sin(pWalkPhase) * 3 * sc;
    tiltA = Math.sin(pWalkPhase) * 0.03;
  } else if(targetAnim === 'attack'){
    bobY = -1 * sc;
    tiltA = -0.03;
    scaleX = 1.05;
  } else if(targetAnim === 'hit'){
    bobY = 5 * sc;
    tiltA = 0.08;
    scaleX = 0.9;
  }
  
  ctx.save();
  ctx.translate(px + swayX, py + bobY);
  ctx.scale(scaleX, 1);
  ctx.rotate(tiltA);
  
  if(stunned){
    ctx.globalAlpha = 0.3 + Math.sin(fm*0.2)*0.15;
    ctx.rotate(Math.sin(fm*0.3)*0.05);
  }
  if(rageOn){
    ctx.shadowColor = '#8098d0';
    ctx.shadowBlur = 25 * sc;
  }
  
  // Draw refined back-view sword cultivator image (single draw)
  if(imgPLAYER.complete){
    ctx.drawImage(imgPLAYER, -w/2, -h/2, w, h);
    
    // Ethereal glow effect for xianxia feel
    if(!stunned){
      ctx.shadowColor = 'rgba(180,200,255,0.1)';
      ctx.shadowBlur = 10*sc;
      ctx.drawImage(imgPLAYER, -w/2, -h/2, w, h);
      ctx.shadowBlur = 0;
    }
  } else {
    // Fallback if image not loaded
    ctx.fillStyle = '#4a5a8a';
    ctx.beginPath();
    ctx.arc(0, 0, 12*sc, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.shadowBlur = 0;
  ctx.restore();
  
  // Flying sword (always on top, separate from body)
  if(!stunned){
    drawFlyingSword(ctx, px, py, sc, targetAnim, rageOn);
  }
}

// ===== FLYING SWORD =====
function drawFlyingSword(ctx, cx, cy, sc, anim, rageOn){
  const orbit = pSwordPhase;
  const r = 28 * sc;
  const sx = cx + Math.cos(orbit) * r;
  const sy = cy + Math.sin(orbit) * r - 8*sc;
  
  ctx.save();
  ctx.translate(sx, sy);
  
  // Attack lunge
  if(anim === 'attack'){
    ctx.translate(40*sc, 0);
  }
  
  const angle = orbit + Math.PI/2;
  ctx.rotate(angle);
  
  // Glow
  ctx.shadowColor = rageOn ? '#c0d0ff' : '#8098d0';
  ctx.shadowBlur = rageOn ? 20*sc : 10*sc;
  
  // Sword body
  ctx.strokeStyle = rageOn ? '#c0d0ff' : '#8098d0';
  ctx.lineWidth = 2.5*sc;
  ctx.beginPath();
  ctx.moveTo(0, -6*sc);
  ctx.lineTo(0, 12*sc);
  ctx.stroke();
  
  // Tip glow
  ctx.fillStyle = '#e0e8ff';
  ctx.beginPath();
  ctx.arc(0, -7*sc, 2*sc, 0, Math.PI*2);
  ctx.fill();
  
  // Guard
  ctx.fillStyle = '#5a6a8a';
  ctx.fillRect(-4*sc, -3*sc, 8*sc, 2*sc);
  
  ctx.shadowBlur = 0;
  ctx.restore();
  
  // Rage aura
  if(rageOn){
    ctx.save();
    ctx.shadowColor = '#c0d0ff';
    ctx.shadowBlur = 30*sc;
    ctx.strokeStyle = 'rgba(192,208,255,0.12)';
    ctx.lineWidth = 6*sc;
    ctx.beginPath();
    ctx.arc(sx, sy, 4*sc, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}
function drawSoldier(ctx,x,y,r,s=1){
  const w=44*dp*s,h=36*dp*s;
  if(imgSOLDIER.complete){ctx.save();ctx.shadowColor='rgba(160,30,40,0.25)';ctx.shadowBlur=10*dp*s;ctx.drawImage(imgSOLDIER,x-w/2,y-h/2,w,h);ctx.restore();return}
  ctx.beginPath();ctx.arc(x,y,10*dp*s,0,Math.PI*2);ctx.fillStyle="#202030";ctx.fill();ctx.fillStyle="#ff5050";ctx.beginPath();ctx.arc(x-3*dp*s,y-2*dp*s,2*dp*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+3*dp*s,y-2*dp*s,2*dp*s,0,Math.PI*2);ctx.fill()
}
function drawElite(ctx,x,y,r,s=1){
  const w=62*dp*s,h=46*dp*s;
  if(imgELITE.complete){ctx.save();ctx.shadowColor='rgba(140,50,200,0.28)';ctx.shadowBlur=14*dp*s;ctx.drawImage(imgELITE,x-w/2,y-h/2,w,h);ctx.restore();return}
  ctx.beginPath();ctx.arc(x,y,14*dp*s,0,Math.PI*2);ctx.fillStyle="#303050";ctx.fill();
}
function drawBossSprite(ctx,x,y,r,s=1,nm){
  ctx.save();
  const w=150*dp*s,h=112*dp*s;
  if(imgBOSS.complete){ctx.shadowColor='#6040c0';ctx.shadowBlur=28*dp*s;ctx.drawImage(imgBOSS,x-w/2,y-h/2,w,h);ctx.shadowBlur=0}
  else{ctx.beginPath();ctx.arc(x,y,28*dp*s,0,Math.PI*2);ctx.fillStyle='#2a1a40';ctx.fill();ctx.strokeStyle='#8060d0';ctx.lineWidth=3*dp*s;ctx.stroke()}
  if(nm){ctx.fillStyle='#c8b8ff';ctx.font='bold '+Math.round(11*dp)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(nm,x,y-h*0.48)}
  ctx.restore()
}

// ===== UPDATE =====
function up(){
  fm++;aSk();if(wtt>0)wtt--;
  if(hf>0){hf--;return}
  if(ivt>0)ivt--;
  if(pst>0){pst--;if(pst<=0){so.classList.remove('active');if(bo){bo.iw=true;bo.wt=Math.min((bo.wt||H*0.22)+H*0.06,H*0.55)}}}
  if(st==='PLAYING'||st==='POWERUP')aS();
  if(ptm>0){ptm--;if(ptm<=0){ptm=0;st='PLAYING'}}
  if(cbt>0)cbt--;

  // Boss AI
  if(bo&&st==='PLAYING'&&!bs&&pst<=0){
    if(bo.iw){if(bo.y<bo.wt)bo.y+=bo.ws;else{bo.iw=false;bo.skt=180}
    bo.x+=Math.sin(fm*0.025)*0.6}else{bo.skt--;if(bo.skt<=0){bo.sa=true;tW()}}
  }

  // Spawn
  if(sq.length>0){stm++;while(sq.length>0&&sq[0].d<=stm){sq.shift();en.push(mS())}}

  // Enemies
  for(let i=en.length-1;i>=0;i--){
    const e=en[i];if(e.f>0)e.f--;
    const sp=e.slow>0?e.sp*0.45:e.sp;if(e.slow>0)e.slow--;if(e.t==='s')e.y+=sp;else{e.a+=0.035;e.x+=Math.sin(e.a)*1.1;e.y+=sp}
    if(e.y>H+20){en.splice(i,1);continue}
    const dx=e.x-px,dy=e.y-pY();
    if(dx*dx+dy*dy<(pr+e.w*0.5)*(pr+e.w*0.5)){if(!e.hit&&ivt<=0){e.hit=true;tD(1)}en.splice(i,1)}
  }

  // Arrows
  for(let i=ar.length-1;i>=0;i--){
    const a=ar[i];a.x+=a.vx;a.y+=a.vy;a.li--;
    if(a.li<=0||a.y<-50||a.y>H+50){ar.splice(i,1);continue}
    let hit=false;
    for(let e of en){
      if(Math.abs(a.x-e.x)<e.w&&Math.abs(a.y-e.y)<e.h){
        e.hp-=a.dmg;e.f=6;if(runUp.frost)e.slow=90;br(a.x,a.y,'#8098d0',a.pw?14:8,a.pw?4:3);aSh(a.pw?6:3);hf=1;
        if(e.hp<=0){sc+=e.t==='e'?30:10;kl++;cbc++;cbt=30;br(e.x,e.y,runUp.chain?'#90b8ff':'#98b0d8',runUp.chain?26:18,runUp.chain?6:5);aSh(8);if(runUp.chain){for(let ee of en){if(ee!==e){const dx=ee.x-e.x,dy=ee.y-e.y;if(dx*dx+dy*dy<120*120*dp*dp){ee.hp-=1;ee.f=8;br(ee.x,ee.y,'#90b8ff',8,3)}}}}en.splice(i,1)}
        if((a.pc||0)>0){a.pc--;hit=false}else hit=true;break;
      }
    }
    if(!hit&&bo&&st==='PLAYING'){
      const dx=a.x-bo.x,dy=a.y-bo.y;
      if(Math.abs(dx)<bo.w&&Math.abs(dy)<bo.h){
        bo.hp-=Math.max(1,a.dmg-1);bo.f=6;br(a.x,a.y,'#8098d0',6,3);
        if(bo.hp<=0){bo.hp=0;oBD()}
        hit=true;
      }
    }
    if(hit)ar.splice(i,1);
  }

  // Particles
  for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.li--;if(p.li<=0)pt.splice(i,1)}

  // Wave transition
  if(st==='PLAYING'){
    if(en.length===0&&sq.length===0&&!bo){
      const wd=cr().waves[cw-1];
      if(wd&&!wd.boss&&cw<cr().waves.length){
        st='WAVETRANS';
        setTimeout(()=>{const wd=cr().waves[cw-1];const go=()=>sWS(cw,()=>{st='IDLE';nW()}); if(wd&&wd.upgrade)showRunUpgrade(go); else go();},300);
      }
    }
  }
}

// ===== WHEEL =====
let ws='IDLE',wsq=[],wpq=[],wss=0,wst=0;
let we=0,wesp=0,wdly=0,wf=-1,wtp=-1;
const WGC=['#dd7060','#ddb860','#80b080'],WA=[-90,-90+120,-90+240],WBC=['#5a2a2a','#7a6a3a','#3a5a45'],WDC=['#1a0a0a','#1a1508','#081a10'],WI=['乾','坎','离'];

function tW(){
  st='WHEEL';wo.classList.add('active');wh.style.display='block';
  const ln=2+Math.min(Math.floor((bo?bo.mh-bo.hp:0)/3),4);
  wsq=[];for(let i=0;i<ln;i++)wsq.push(Math.floor(Math.random()*3));
  wpq=[];wss=0;wst=0;we=0;wdly=0;wf=-1;wtp=-1;wr.classList.remove('show');ws='SHOW';
  const r=document.getElementById('wheel-wrap').getBoundingClientRect();
  document.getElementById('wheel-canvas').width=r.width*dp;document.getElementById('wheel-canvas').height=r.height*dp;
}
function dW(){
  const r=document.getElementById('wheel-wrap').getBoundingClientRect();
  const cx=document.getElementById('wheel-canvas').width/2,cy=document.getElementById('wheel-canvas').height/2;
  const wr=Math.min(document.getElementById('wheel-canvas').width,document.getElementById('wheel-canvas').height)*0.36,wg=wr*0.14;
  wc.clearRect(0,0,document.getElementById('wheel-canvas').width,document.getElementById('wheel-canvas').height);
  wc.fillStyle='rgba(0,0,0,0.4)';wc.fillRect(0,0,document.getElementById('wheel-canvas').width,document.getElementById('wheel-canvas').height);
  for(let i=0;i<3;i++){
    const st=WA[i]*Math.PI/180,en=st+120*Math.PI/180;
    wc.beginPath();wc.moveTo(cx,cy);wc.arc(cx,cy,wr,st,en);wc.closePath();
    if(wtp===i){wc.fillStyle='rgba(255,255,255,0.35)';wc.shadowColor='#fff';wc.shadowBlur=35}
    else if(wf===i){const g=wc.createRadialGradient(cx,cy,0,cx,cy,wr);g.addColorStop(0,WGC[i]);g.addColorStop(0.4,WGC[i]);g.addColorStop(1,WBC[i]);wc.fillStyle=g;wc.shadowColor=WGC[i];wc.shadowBlur=55}
    else if(wf>=0){wc.fillStyle=WDC[i];wc.shadowBlur=0}else{wc.fillStyle=WBC[i];wc.shadowBlur=0}
    wc.fill();wc.shadowBlur=0;
    const a1=WA[i]*Math.PI/180;wc.beginPath();wc.moveTo(cx,cy);wc.lineTo(cx+Math.cos(a1)*wr,cy+Math.sin(a1)*wr);wc.strokeStyle='#000';wc.lineWidth=3;wc.stroke();
    const ma=(WA[i]+60)*Math.PI/180,ir=wr*0.55;
    wc.fillStyle=wf===i?'#fff':wf>=0?'rgba(180,150,120,0.25)':'rgba(180,150,120,0.6)';
    wc.font=Math.round(wr*0.11)+'px sans-serif';wc.textAlign='center';wc.textBaseline='middle';
    wc.fillText(WI[i],cx+Math.cos(ma)*ir,cy+Math.sin(ma)*ir);
  }
  wc.beginPath();wc.arc(cx,cy,wr,0,Math.PI*2);wc.strokeStyle='rgba(0,0,0,0.8)';wc.lineWidth=3;wc.stroke();
  const tr=wr+wg;
  wc.beginPath();wc.arc(cx,cy,tr,0,Math.PI*2);wc.strokeStyle='rgba(160,120,100,0.35)';wc.lineWidth=2.5;wc.setLineDash([6,8]);wc.stroke();wc.setLineDash([]);
  if(we>0&&we<=1){const rr=we*tr;let rc,gs;if(we>=0.92){rc='#d4a050';gs=50}else if(we>=0.75){rc='#70a070';gs=30}else if(we>=0.45){rc='#8090b0';gs=18}else{rc='rgba(180,150,130,0.6)';gs=8}
  wc.beginPath();wc.arc(cx,cy,rr,0,Math.PI*2);wc.strokeStyle=rc;wc.lineWidth=wg*0.35;wc.shadowColor=rc;wc.shadowBlur=gs;wc.stroke();wc.shadowBlur=0}
  if((ws==='REP'||ws==='REP_WAIT'||ws==='DELAY'||ws==='RING')&&wsq.length>0){
    const dy=cy+wr+wg+18,tw=wsq.length*24-4,sx=cx-tw/2;
    for(let i=0;i<wsq.length;i++){const dx=sx+i*24;wc.beginPath();wc.arc(dx,dy,6,0,Math.PI*2);if(i<wpq.length){wc.fillStyle=WGC[wsq[i]];wc.shadowColor=WGC[wsq[i]];wc.shadowBlur=8}else{wc.fillStyle='rgba(255,255,255,0.08)';wc.shadowBlur=0}wc.fill();wc.shadowBlur=0}
  }
}
function uW(){
  if(ws==='SHOW'){wst++;if(wst%45===0){wf=wsq[wss];wss++;if(wss>=wsq.length){setTimeout(()=>{wf=-1;ws='REP';wh.textContent='按顺序点击';},500);ws='REP_WAIT'}}}
  if(ws==='DELAY'){wdly--;if(wdly<=0){ws='RING';we=0.02}}
  if(ws==='RING'){we+=wesp;if(we>=1){we=1;eW('失误')}}
}
function eW(r){
  const ok=r==='PERFECT';
  wr.querySelector('span').textContent=ok?'完美':r==='优'?'优':r;
  wr.querySelector('span').style.color=ok?'#d4a050':r==='优'?'#70a070':'#904040';
  wr.classList.add('show');wh.style.display='none';
  setTimeout(()=>{wr.classList.remove('show');wo.classList.remove('active');
    if(ok||r==='优'){
      // SUCCESS → 暴走 mode: player goes berserk, massive damage to boss
      if(bo){bs=true;bo.f=20;const bd=ok?2:1;bo.hp-=bd;if(bo.hp<=0){bo.hp=0;oBD();return}}
      // 暴走: player enters rage mode — rapid fire + auto-aim + massive boss damage
      st='PLAYING';ptm=240; // 4 seconds of 暴走
      // During 暴走, every arrow hits boss automatically for extra damage
      // Handled in the update loop
      setTimeout(()=>{bs=false;if(bo){bo.iw=true;bo.wt=Math.min((bo.wt||H*0.22)+H*0.08,H*0.55)}},300);
    }else{
      // FAILURE → player stunned
      st='PLAYING';pst=180;so.classList.add('active');
      if(bo){bo.iw=false;bo.skt=240}
    }
  },500);
}
document.getElementById('wheel-canvas').addEventListener('pointerdown',(e)=>{
  e.preventDefault();
  if(st!=='WHEEL'||(ws!=='REP'&&ws!=='RING'))return;
  if(ws==='REP'){
    const r=document.getElementById('wheel-wrap').getBoundingClientRect(),x=(e.clientX-r.left)*dp,y=(e.clientY-r.top)*dp;
    const cx=document.getElementById('wheel-canvas').width/2,cy=document.getElementById('wheel-canvas').height/2;
    const wr=Math.min(document.getElementById('wheel-canvas').width,document.getElementById('wheel-canvas').height)*0.36;
    const dx=x-cx,dy=y-cy;
    if(Math.sqrt(dx*dx+dy*dy)>wr||Math.sqrt(dx*dx+dy*dy)<wr*0.10)return;
    let ang=Math.atan2(dy,dx)*180/Math.PI;ang=(ang+90+360)%360;
    const seg=Math.floor(ang/120);wtp=seg;setTimeout(()=>{if(wtp===seg)wtp=-1},100);
    if(seg!==wsq[wpq.length]){wf=seg;setTimeout(()=>wf=-1,180);return}
    wpq.push(seg);
    if(wpq.length===wsq.length){ws='DELAY';wdly=30;we=0;wesp=1/(60*1.2);wh.textContent='准备'}
  }else if(ws==='RING'){let r;if(we>=0.92)r='PERFECT';else if(we>=0.75)r='优';else r='失误';eW(r)}
});

  mc.lineTo(W,H*0.68);mc.lineTo(0,H*0.68);mc.closePath();mc.fill();

  // Boss skill warning
  if(bo&&!bo.iw&&!bs&&bo.skt>0&&bo.skt<120&&st==='PLAYING'){
    mc.fillStyle='#b08040';mc.font='bold '+Math.round(11*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='bottom';
    const p=Math.sin(fm*0.15)*0.3+0.7;mc.globalAlpha=p;mc.fillText('⚠ 蓄力·准备破招',bo.x,bo.y+50*dp);mc.globalAlpha=1
  }

  // Boss
  if(bo){
    drawBossSprite(mc,bo.x,bo.y,42*dp,1,bo.bs);
    if(bs){mc.beginPath();mc.arc(bo.x,bo.y,32*dp,0,Math.PI*2);mc.fillStyle=`rgba(212,160,80,${0.08+Math.sin(fm*0.1)*0.04})`;mc.fill();mc.fillStyle='#d4a050';mc.font='bold '+Math.round(12*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='top';mc.fillText('破绽！',bo.x,bo.y+36*dp)}
    const bw=W*0.55,bh=5*dp,bx=W/2-bw/2,by=bo.y+55*dp;
    mc.fillStyle='rgba(100,60,140,0.2)';mc.fillRect(bx,by,bw,bh);
    if(bo.hp>0){mc.fillStyle='#8060c0';mc.fillRect(bx,by,bw*(bo.hp/bo.mh),bh)}
  }

  // Enemies — Q版 sprites
  for(let e of en){
    if(e.f>0){mc.globalAlpha=0.7+Math.sin(fm*0.5)*0.3}
    if(e.t==='s')drawSoldier(mc,e.x,e.y,18*dp);else drawElite(mc,e.x,e.y,20*dp);
    mc.globalAlpha=1;
  }

  // Arrows
  for(let a of ar){
    const hs=a.sz*2.5;
    mc.strokeStyle=a.pw?'#8098d0':'#6a7aaa';mc.lineWidth=a.sz;mc.shadowColor=a.pw?'#e8c040':'transparent';mc.shadowBlur=a.pw?15:0;
    mc.beginPath();mc.moveTo(a.x,a.y);mc.lineTo(a.x,a.y+40);mc.stroke();
    mc.beginPath();mc.moveTo(a.x,a.y);mc.lineTo(a.x-hs*0.5,a.y-hs);mc.lineTo(a.x+hs*0.5,a.y-hs);mc.closePath();
    mc.fillStyle=a.pw?'#8098d0':'#6a7aaa';mc.fill();mc.shadowBlur=0;
    mc.globalAlpha=0.15;mc.beginPath();mc.moveTo(a.x,a.y+6);mc.lineTo(a.x,a.y+32);mc.strokeStyle=a.pw?'#8098d0':'#6a7aaa';mc.lineWidth=a.sz*0.5;mc.stroke();mc.globalAlpha=1;
  }

  // Particles
  for(let p of pt){mc.globalAlpha=p.li/p.ml;mc.beginPath();mc.arc(p.x,p.y,p.sz*(p.li/p.ml),0,Math.PI*2);mc.fillStyle=p.c;mc.fill()}
  mc.globalAlpha=1;

  // Player — Q版 sprite
  const isSt=pst>0,pw=ptm>0;
  drawPlayerChar(mc,px,pY(),22*dp,1,isSt,pw);
  if(ivt>0&&Math.floor(ivt/6)%2===0){mc.beginPath();mc.arc(px,pY(),eR+5*dp,0,Math.PI*2);mc.strokeStyle='rgba(100,140,200,0.2)';mc.lineWidth=2*dp;mc.stroke()}
  // 暴走 glow
  if(pw){mc.beginPath();mc.arc(px,pY(),eR*2.5,0,Math.PI*2);const g=mc.createRadialGradient(px,pY(),0,px,pY(),eR*2.5);g.addColorStop(0,'rgba(128,152,208,0.15)');g.addColorStop(1,'rgba(128,152,208,0)');mc.fillStyle=g;mc.fill();
    mc.fillStyle='#e8c030';mc.font='bold '+Math.round(10*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='top';mc.fillText('⚡ 暴 走 ⚡',px,pY()+eR+12*dp)}

  mc.restore();
}

// ===== 暴走 — extra boss damage during rage =====
// During 暴走 (ptm>0), every arrow that reaches boss area deals bonus damage
// Handled in arrow collision: during 暴走, add auto-damage to boss
// Also, during 暴走, automatically deal damage to boss per frame
let rageTimer=0;
// Modified arrow damage during 暴走 is already handled by dmg=2 (powered)
// Additional: every 10 frames during 暴走, boss takes 1 extra damage
function applyRageDamage(){
  if(ptm>0&&bo&&st==='PLAYING'){
    rageTimer++;
    if(rageTimer>=8){
      rageTimer=0;
      bo.hp-=1;
      br(bo.x,bo.y,'#8098d0',6,3);
      aSh(5);
      if(bo.hp<=0){bo.hp=0;oBD()}
    }
  } else {
    rageTimer=0;
  }
}

// ===== LOOP =====
function lp(){
  if(st==='PLAYING'||st==='POWERUP'){up();applyRageDamage()}
  if(st==='WHEEL'){up();uW()}
  if(st==='WAVETRANS')up();
  drawGame();
  if(st==='WHEEL')dW();
  requestAnimationFrame(lp)
}

// ===== START =====
function sG(ci){
  cc=ci;cw=0;wv=0;st='IDLE';hp=mhp;sc=0;kl=0;cbc=0;cbt=0;
  en=[];ar=[];pt=[];bo=null;ptm=0;bs=false;sq=[];stm=0;si=0;fx=false;ac=0;pst=0;hf=0;ivt=0;runUp={split:0,pierce:0,frost:0,chain:0,guard:0,speed:0};
  wo.classList.remove('active');wh.style.display='none';so.classList.remove('active');
  iPl();document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  st='PLAYING';nW();if(!loopStarted){loopStarted=true;lp();}
}
function rG(){sv=ld();sG(cc)}

// ===== UI =====
document.getElementById('story-go').onclick=()=>{shP('page-menu');st='MENU'}
document.getElementById('m-start').onclick=()=>{rCL();shP('page-chapter')}
document.getElementById('m-upgrade').onclick=()=>{rUP();shP('page-upgrade')}
document.getElementById('ch-back').onclick=()=>shP('page-menu')
document.getElementById('up-back').onclick=()=>{sv=ld();shP('page-menu')}
document.getElementById('d-retry').onclick=rG;document.getElementById('d-menu').onclick=()=>{sv=ld();shP('page-menu');st='MENU'}
document.getElementById('v-retry').onclick=rG;document.getElementById('v-menu').onclick=()=>{sv=ld();shP('page-menu');st='MENU'}

function rCL(){
  const list=document.getElementById('ch-list');list.innerHTML='';
  CH.forEach((ch,idx)=>{
    const ul=idx<sv.ul;
    const d=document.createElement('div');d.className='ch-node'+(ul?' active':' locked');
    d.innerHTML=ul?`<div class="ch-icon">${ch.icon}</div><div class="ch-info"><div class="ch-name">${ch.name}</div><div class="ch-desc">${ch.waves.length}波 · 包含BOSS战</div></div>`
      :`<div class="ch-icon">🔒</div><div class="ch-info"><div class="ch-name">${ch.name}</div><div class="ch-desc">通关上一章解锁</div></div>`;
    if(ul)d.addEventListener('click',()=>sG(idx));
    list.appendChild(d);
  });
}

function rUP(){
  document.getElementById('qi-amt').textContent=sv.qi;
  const list=document.getElementById('up-list');list.innerHTML='';
  UPS.forEach(u=>{
    const lv=sv.up[u.id]||0,mx=lv>=u.mx,cst=mx?0:u.cs[lv],can=!mx&&sv.qi>=cst;
    const d=document.createElement('div');d.className='up-item'+(mx?' maxed':'');
    d.innerHTML=`<div class="up-ic">${u.ic}</div><div class="up-inner"><div class="up-nm">${u.nm}</div><div class="up-desc">${u.ds}</div><div class="up-lv">${'▮'.repeat(lv)}${'▯'.repeat(u.mx-lv)}</div></div><div class="up-cost">${mx?'已满':'¥'+cst}</div>`;
    if(!mx&&can){d.addEventListener('click',()=>{sv.qi-=cst;sv.up[u.id]=(sv.up[u.id]||0)+1;svSave(sv);rUP()})}
    list.appendChild(d);
  });
}

// ===== INIT =====
sv=ld();shP('page-story');st='STORY';iPl();
</script>
