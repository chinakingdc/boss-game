<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>弹幕防线 · 三国</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#87cebe;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;user-select:none}
#game{width:100%;max-width:420px;height:100dvh;position:relative;overflow:hidden;background:#e8f0e0}
canvas#main{width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s;pointer-events:auto}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{background:rgba(255,248,235,0.93);border:2px solid #c8a87a;border-radius:10px;padding:20px 24px;width:84%;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.panel-title{color:#7a5a3a;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px;margin-bottom:6px}
.panel-sub{color:#9a8a7a;font-size:12px;text-align:center;letter-spacing:2px;margin-bottom:14px;line-height:1.6}
.panel-deco{width:40px;height:2px;background:linear-gradient(90deg,transparent,#c8a87a,transparent);margin:0 auto 12px}
.btn-gold{display:inline-block;padding:10px 32px;background:#e8c88a;border:2px solid #c8a050;border-radius:6px;color:#5a3a1a;font-size:15px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-gold:active{background:#d8b870;transform:scale(0.96)}
.btn-ghost{display:inline-block;padding:6px 14px;border:1px solid #c8a87a;border-radius:4px;background:transparent;color:#8a7a6a;font-size:12px;letter-spacing:2px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-ghost:active{background:rgba(200,168,122,0.1)}
.story-text{color:#5a4a3a;font-size:13px;line-height:2;text-align:center;white-space:pre-line;letter-spacing:1px}
.seal-btn{display:inline-block;padding:8px 28px;background:#b03030;border:2px solid #802020;border-radius:4px;color:#fff8e8;font-size:14px;font-weight:700;letter-spacing:6px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.seal-btn:active{background:#902020;transform:scale(0.96)}
/* Turret */
#turret-btn{position:absolute;left:6px;bottom:14%;z-index:10;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#c8a070,#a08050);border:2px solid #8a6030;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all 0.15s;box-shadow:0 2px 8px rgba(0,0,0,0.15);touch-action:none;pointer-events:auto}
#turret-btn:active{transform:scale(0.9);background:linear-gradient(135deg,#b89060,#907040)}
#turret-cd{position:absolute;left:6px;bottom:14%;z-index:11;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;pointer-events:none}
/* Stun */
#stun-overlay{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(180,40,40,0)}
#stun-overlay.active{display:flex;background:rgba(180,40,40,0.15)}
#stun-text{color:#d04040;font-size:28px;font-weight:bold;letter-spacing:8px;text-shadow:0 0 30px #d04040;animation:stunPulse 0.3s alternate infinite}
@keyframes stunPulse{from{opacity:0.6;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
/* Wheel */
.wheel-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center}
.wheel-bg.active{display:flex}
#wheel-wrap{position:relative;width:min(240px,60vw);height:min(240px,60vw)}
#wheel-hint{position:absolute;top:8%;left:50%;transform:translateX(-50%);color:#f0d890;font-size:12px;letter-spacing:4px;z-index:25;display:none;text-align:center}
canvas#wheel-canvas{width:100%;height:100%}
#wheel-rating{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%) scale(0);pointer-events:none;z-index:30;transition:transform 0.1s cubic-bezier(0.34,1.56,0.64,1)}
#wheel-rating.show{transform:translate(-50%,-60%) scale(1)}
#wheel-rating span{font-size:40px;font-weight:700;letter-spacing:6px;text-shadow:0 0 40px currentColor}
/* Pages */
.page{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s}
.page.hidden{opacity:0;pointer-events:none}
.death-screen{z-index:60}
.win-screen{z-index:55}
/* Map */
.ch-node{display:flex;align-items:center;gap:12px;padding:12px 18px;border:2px solid #c8a87a;border-radius:8px;background:rgba(255,248,235,0.7);cursor:pointer;transition:all 0.15s;width:100%}
.ch-node.active{border-color:#a08050}
.ch-node.locked{opacity:0.4;cursor:default}
.ch-node:not(.locked):active{background:rgba(200,168,122,0.2);border-color:#8a6030}
.ch-icon{font-size:30px;width:40px;text-align:center}
.ch-info{flex:1}
.ch-name{color:#5a3a1a;font-size:14px;font-weight:700;letter-spacing:2px}
.ch-desc{color:#8a7a6a;font-size:11px;letter-spacing:1px;margin-top:2px}
/* Upgrades */
.up-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #d8c8b0;border-radius:6px;background:rgba(255,248,235,0.5);cursor:pointer;transition:all 0.15s;margin-bottom:6px}
.up-item.maxed{opacity:0.5;cursor:default}
.up-item:not(.maxed):active{background:rgba(200,168,122,0.2)}
.up-ic{font-size:22px;width:30px;text-align:center}
.up-inner{flex:1}
.up-nm{color:#5a3a1a;font-size:13px;font-weight:600}
.up-desc{color:#8a7a6a;font-size:10px}
.up-lv{color:#a08060;font-size:11px}
.up-cost{color:#b08040;font-size:12px;font-weight:700;min-width:30px;text-align:right}
.qi-text{color:#b08040;font-size:16px;font-weight:700;letter-spacing:2px}
.qi-text span{color:#d4a050;font-size:20px}
/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.4s ease-out both}
.fd1{animation-delay:0.1s}.fd2{animation-delay:0.25s}.fd3{animation-delay:0.4s}.fd4{animation-delay:0.55s}
</style>
</head>
<body>
<div id="game">
  <canvas id="main"></canvas>
  
  <!-- Turret -->
  <div id="turret-btn">🏹</div>
  <div id="turret-cd"></div>

  <!-- Stun -->
  <div id="stun-overlay"><div id="stun-text">⚡ 瘫痪</div></div>

  <!-- Wheel -->
  <div id="wheel-hint">记住顺序 · 点击破招</div>
  <div class="wheel-bg" id="wheel-overlay">
    <div id="wheel-wrap"><canvas id="wheel-canvas"></canvas><div id="wheel-rating"><span></span></div></div>
  </div>

  <!-- Story intro -->
  <div id="page-story" class="page">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title">弹 幕 防 线</div>
      <div class="panel-sub">· 三 国 篇 ·</div>
      <div class="story-text" style="margin-bottom:16px">
        天下三分·暗流涌动
        诸侯各怀异心·乱世再起

        你是一名无名弓手
        在这烽火连天的时代
        独自踏上了征途
      </div>
      <div style="text-align:center"><button class="seal-btn" id="story-go">出 征</button></div>
    </div>
  </div>

  <!-- Menu -->
  <div id="page-menu" class="page hidden">
    <div class="fade-up fd1" style="font-size:42px;letter-spacing:8px;color:#5a3a1a;font-weight:700;margin-bottom:2px">弹幕防线</div>
    <div class="fade-up fd2" style="font-size:12px;color:#9a8a7a;letter-spacing:6px;margin-bottom:24px">· 一 人 一 弓 ·</div>
    <div class="fade-up fd3" style="display:flex;flex-direction:column;gap:10px;align-items:center">
      <button class="btn-gold" id="m-start" style="min-width:160px">开 始</button>
      <button class="btn-ghost" id="m-upgrade" style="min-width:140px">修 炼</button>
    </div>
    <div class="fade-up fd4" style="position:absolute;bottom:36px;color:#b8a898;font-size:10px;letter-spacing:2px">独立游戏 · Q版三国</div>
  </div>

  <!-- Chapter -->
  <div id="page-chapter" class="page hidden">
    <div style="position:absolute;top:20px;left:12px"><button class="btn-ghost" id="ch-back">← 返回</button></div>
    <div class="panel-deco"></div>
    <div class="panel-sub" style="margin-bottom:16px;font-size:13px">选 择 战 场</div>
    <div id="ch-list" style="display:flex;flex-direction:column;gap:10px;width:84%;max-width:300px"></div>
  </div>

  <!-- Upgrade -->
  <div id="page-upgrade" class="page hidden">
    <div style="position:absolute;top:20px;left:12px"><button class="btn-ghost" id="up-back">← 返回</button></div>
    <div class="panel-deco"></div>
    <div class="qi-text fade-up fd1">真气 · <span id="qi-amt">0</span></div>
    <div id="up-list" style="width:84%;max-width:300px;margin-top:12px"></div>
  </div>

  <!-- Wave story -->
  <div id="page-wave-story" class="page hidden" style="z-index:45">
    <div class="panel fade-up">
      <div class="story-text" id="ws-text"></div>
      <div style="text-align:center;margin-top:12px"><span class="btn-ghost" id="ws-next">继 续</span></div>
    </div>
  </div>

  <!-- Victory -->
  <div id="page-victory" class="page win-screen hidden">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title" style="color:#c88030">胜 利</div>
      <div id="v-chapter" style="color:#7a5a3a;font-size:14px;font-weight:700;letter-spacing:4px;margin:8px 0"></div>
      <div id="v-stats" style="color:#8a7a6a;font-size:12px;text-align:center;margin-bottom:6px;"></div>
      <div style="color:#b08040;font-size:14px;font-weight:700;margin-bottom:14px">获得 <span id="v-qi" style="color:#d4a050">0</span> 真气</div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
        <button class="btn-gold" id="v-retry" style="padding:8px 24px;font-size:13px">再战一次</button>
        <button class="btn-ghost" id="v-menu">返回主界面</button>
      </div>
    </div>
  </div>

  <!-- Death -->
  <div id="page-death" class="page death-screen hidden">
    <div class="panel fade-up">
      <div class="panel-deco"></div>
      <div class="panel-title" style="color:#903030">败 北</div>
      <div id="d-reason" style="color:#8a7a6a;font-size:13px;margin:10px 0 16px;text-align:center"></div>
      <div id="d-stats" style="color:#7a6a5a;font-size:12px;text-align:center;margin-bottom:14px"></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
        <button class="btn-gold" id="d-retry" style="padding:8px 24px;font-size:13px">再试一次</button>
        <button class="btn-ghost" id="d-menu">返回主界面</button>
      </div>
    </div>
  </div>
</div>

  if(st!=='WHEEL'||(ws!=='REP'&&ws!=='RING'))return;
  if(ws==='REP'){
    const r=document.getElementById('wheel-wrap').getBoundingClientRect(),x=(e.clientX-r.left)*dp,y=(e.clientY-r.top)*dp;
    const cx=document.getElementById('wheel-canvas').width/2,cy=document.getElementById('wheel-canvas').height/2;
    const wr=Math.min(document.getElementById('wheel-canvas').width,document.getElementById('wheel-canvas').height)*0.36;
    const dx=x-cx,dy=y-cy;
    if(Math.sqrt(dx*dx+dy*dy)>wr||Math.sqrt(dx*dx+dy*dy)<wr*0.10)return;
    let ang=Math.atan2(dy,dx)*180/Math.PI;ang=(ang+90+360)%360;
    const seg=Math.floor(ang/120);wtp=seg;setTimeout(()=>{if(wtp===seg)wtp=-1},100);
    if(seg!==wsq[wpq.length]){wf=seg;setTimeout(()=>wf=-1,180);return}
    wpq.push(seg);
    if(wpq.length===wsq.length){ws='DELAY';wdly=30;we=0;wesp=1/(60*1.2);wh.textContent='准备'}
  }else if(ws==='RING'){let r;if(we>=0.92)r='PERFECT';else if(we>=0.75)r='优';else r='失误';eW(r)}
});

// ===== TOUCH =====
cn.addEventListener('pointerdown',(e)=>{e.preventDefault();if((st==='PLAYING'||st==='POWERUP')&&pst<=0){fx=e.clientX;uP(e.clientX)}});
cn.addEventListener('pointermove',(e)=>{e.preventDefault();if(fx!==false&&(st==='PLAYING'||st==='POWERUP')&&pst<=0)uP(e.clientX)});
cn.addEventListener('pointerup',()=>{fx=false});cn.addEventListener('pointerleave',()=>{fx=false});
function uP(cx){const r=cn.getBoundingClientRect();px=((cx-r.left)/r.width)*W;px=Math.max(pr+5,Math.min(W-pr-5,px))}

// ===== DRAW =====
function aSk(){if(si>0){sx=(Math.random()-0.5)*si*dp;sy=(Math.random()-0.5)*si*dp;si*=0.82;if(si<0.5)si=0}else{sx=0;sy=0}}

function drawGame(){
  if(st==='MENU'||st==='STORY'||st==='CHAPTER'||st==='UPGRADE'||st==='LOSE'||st==='WIN')return;
  mc.save();mc.translate(sx,sy);
  const pal=cr().palette;
  // Sky
  mc.fillStyle=pal.sky;mc.fillRect(0,0,W,H*0.65);
  // Sky gradient
  const sg=mc.createLinearGradient(0,0,0,H*0.65);sg.addColorStop(0,'rgba(200,232,240,1)');sg.addColorStop(1,'rgba(180,210,200,0.3)');
  mc.fillStyle=sg;mc.fillRect(0,0,W,H*0.65);
  // Clouds
  mc.fillStyle='rgba(255,255,255,0.3)';
  mc.beginPath();mc.arc(W*0.2,H*0.08,W*0.12,0,Math.PI*2);mc.fill();
  mc.beginPath();mc.arc(W*0.7,H*0.15,W*0.1,0,Math.PI*2);mc.fill();
  mc.beginPath();mc.arc(W*0.85,H*0.06,W*0.08,0,Math.PI*2);mc.fill();
  mc.beginPath();mc.arc(W*0.1,H*0.22,W*0.07,0,Math.PI*2);mc.fill();
  // Grass ground
  mc.fillStyle=pal.grass;mc.fillRect(0,H*0.6,W,H*0.45);
  // Ground detail
  mc.fillStyle=pal.ground;mc.fillRect(0,H*0.6,W,dp*4);
  // Grass tufts
  mc.strokeStyle='rgba(60,100,60,0.15)';mc.lineWidth=1.5*dp;
  for(let i=0;i<10;i++){const gx=Math.random()*W,gy=H*0.6+Math.random()*H*0.25;mc.beginPath();mc.moveTo(gx,gy);mc.lineTo(gx-dp*3,gy-dp*8);mc.moveTo(gx,gy);mc.lineTo(gx+dp*3,gy-dp*10);mc.stroke()}

  // HUD bar (semi-transparent)
  mc.fillStyle='rgba(255,240,220,0.75)';mc.fillRect(0,hY(),W,B*H);
  mc.strokeStyle='rgba(200,168,122,0.3)';mc.lineWidth=1;mc.beginPath();mc.moveTo(0,hY());mc.lineTo(W,hY());mc.stroke();
  const spdUp=(sv.up.spd||0)*0.08;
  const eR=pr+spdUp*pr;
  let hs='';for(let i=0;i<mhp;i++)hs+=i<hp?'❤':'🖤';
  mc.fillStyle='#5a3a1a';mc.font=Math.round(13*dp)+'px sans-serif';mc.textAlign='left';mc.textBaseline='middle';
  mc.fillText(hs+' '+sc+'分',14*dp,hY()+B*H*0.4);
  // Wave info
  mc.textAlign='right';mc.fillText(wts||cr().waves[cw-1]?.name||'',W-14*dp,hY()+B*H*0.4);
  // Combo
  if(cbt>0&&cbc>=3){mc.save();mc.translate(W/2,hY()-20*dp);const s=1+Math.sin(fm*0.3)*0.1;mc.scale(s,s);mc.fillStyle='#c88030';mc.font='bold '+Math.round(14*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='middle';mc.fillText('连杀 ×'+cbc,0,0);mc.restore()}

  // Wave text
  if(wtt>0){const a=wtt>60?1:wtt/60;mc.globalAlpha=a;mc.fillStyle='#7a5a3a';mc.font=Math.round(13*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='middle';mc.fillText(wts,W/2,H*0.35);mc.globalAlpha=1}

  // Boss skill warning
  if(bo&&!bo.iw&&!bs&&bo.skt>0&&bo.skt<120&&st==='PLAYING'){
    mc.fillStyle='#b08040';mc.font='bold '+Math.round(11*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='bottom';
    const p=Math.sin(fm*0.15)*0.3+0.7;mc.globalAlpha=p;mc.fillText('⚠ 蓄力·准备破招',bo.x,bo.y+50*dp);mc.globalAlpha=1
  }

  // Boss
  if(bo){
    drawBossSprite(mc,bo.x,bo.y,28*dp,1,bo.bs);
    if(bs){mc.beginPath();mc.arc(bo.x,bo.y,32*dp,0,Math.PI*2);mc.fillStyle=`rgba(212,160,80,${0.08+Math.sin(fm*0.1)*0.04})`;mc.fill();mc.fillStyle='#d4a050';mc.font='bold '+Math.round(12*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='top';mc.fillText('破绽！',bo.x,bo.y+36*dp)}
    const bw=W*0.5,bh=5*dp,bx=W/2-bw/2,by=bo.y+36*dp;
    mc.fillStyle='rgba(200,100,80,0.2)';mc.fillRect(bx,by,bw,bh);
    if(bo.hp>0){mc.fillStyle='#c04030';mc.fillRect(bx,by,bw*(bo.hp/bo.mh),bh)}
  }

  // Enemies — Q版 sprites
  for(let e of en){
    if(e.f>0){mc.globalAlpha=0.7+Math.sin(fm*0.5)*0.3}
    if(e.t==='s')drawSoldier(mc,e.x,e.y,18*dp);else drawElite(mc,e.x,e.y,20*dp);
    mc.globalAlpha=1;
  }

  // Arrows
  for(let a of ar){
    const hs=a.sz*2.5;
    mc.strokeStyle=a.pw?'#e8c040':'#7a5a3a';mc.lineWidth=a.sz;mc.shadowColor=a.pw?'#e8c040':'transparent';mc.shadowBlur=a.pw?15:0;
    mc.beginPath();mc.moveTo(a.x,a.y);mc.lineTo(a.x,a.y+40);mc.stroke();
    mc.beginPath();mc.moveTo(a.x,a.y);mc.lineTo(a.x-hs*0.5,a.y-hs);mc.lineTo(a.x+hs*0.5,a.y-hs);mc.closePath();
    mc.fillStyle=a.pw?'#e8c040':'#7a5a3a';mc.fill();mc.shadowBlur=0;
    mc.globalAlpha=0.15;mc.beginPath();mc.moveTo(a.x,a.y+6);mc.lineTo(a.x,a.y+32);mc.strokeStyle=a.pw?'#e8c040':'#7a5a3a';mc.lineWidth=a.sz*0.5;mc.stroke();mc.globalAlpha=1;
  }

  // Particles
  for(let p of pt){mc.globalAlpha=p.li/p.ml;mc.beginPath();mc.arc(p.x,p.y,p.sz*(p.li/p.ml),0,Math.PI*2);mc.fillStyle=p.c;mc.fill()}
  mc.globalAlpha=1;

  // Player — Q版 sprite
  const isSt=pst>0,pw=ptm>0;
  drawPlayerChar(mc,px,pY(),22*dp,1,isSt,pw);
  if(ivt>0&&Math.floor(ivt/6)%2===0){mc.beginPath();mc.arc(px,pY(),eR+5*dp,0,Math.PI*2);mc.strokeStyle='rgba(200,168,122,0.3)';mc.lineWidth=2*dp;mc.stroke()}
  // 暴走 glow
  if(pw){mc.beginPath();mc.arc(px,pY(),eR*2.5,0,Math.PI*2);const g=mc.createRadialGradient(px,pY(),0,px,pY(),eR*2.5);g.addColorStop(0,'rgba(232,192,64,0.15)');g.addColorStop(1,'rgba(232,192,64,0)');mc.fillStyle=g;mc.fill();
    mc.fillStyle='#e8c030';mc.font='bold '+Math.round(10*dp)+'px sans-serif';mc.textAlign='center';mc.textBaseline='top';mc.fillText('⚡ 暴 走 ⚡',px,pY()+eR+12*dp)}

  mc.restore();
}

// ===== 暴走 — extra boss damage during rage =====
// During 暴走 (ptm>0), every arrow that reaches boss area deals bonus damage
// Handled in arrow collision: during 暴走, add auto-damage to boss
// Also, during 暴走, automatically deal damage to boss per frame
let rageTimer=0;
// Modified arrow damage during 暴走 is already handled by dmg=2 (powered)
// Additional: every 10 frames during 暴走, boss takes 1 extra damage
function applyRageDamage(){
  if(ptm>0&&bo&&st==='PLAYING'){
    rageTimer++;
    if(rageTimer>=8){
      rageTimer=0;
      bo.hp-=1;
      br(bo.x,bo.y,'#e8c040',6,3);
      aSh(5);
      if(bo.hp<=0){bo.hp=0;oBD()}
    }
  } else {
    rageTimer=0;
  }
}

// ===== LOOP =====
function lp(){
  if(st==='PLAYING'||st==='POWERUP'){up();applyRageDamage()}
  if(st==='WHEEL'){up();uW()}
  if(st==='WAVETRANS')up();
  drawGame();
  if(st==='WHEEL')dW();
  requestAnimationFrame(lp)
}

// ===== START =====
function sG(ci){
  cc=ci;cw=0;wv=0;st='IDLE';hp=mhp;sc=0;kl=0;cbc=0;cbt=0;
  en=[];ar=[];pt=[];bo=null;ptm=0;bs=false;sq=[];stm=0;si=0;fx=false;ac=0;pst=0;hf=0;ivt=0;
  wo.classList.remove('active');wh.style.display='none';so.classList.remove('active');
  iPl();document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  st='PLAYING';nW();lp();
}
function rG(){sv=ld();sG(cc)}

// ===== UI =====
document.getElementById('story-go').onclick=()=>{shP('page-menu');st='MENU'}
document.getElementById('m-start').onclick=()=>{rCL();shP('page-chapter')}
document.getElementById('m-upgrade').onclick=()=>{rUP();shP('page-upgrade')}
document.getElementById('ch-back').onclick=()=>shP('page-menu')
document.getElementById('up-back').onclick=()=>{sv=ld();shP('page-menu')}
document.getElementById('d-retry').onclick=rG;document.getElementById('d-menu').onclick=()=>{sv=ld();shP('page-menu');st='MENU'}
document.getElementById('v-retry').onclick=rG;document.getElementById('v-menu').onclick=()=>{sv=ld();shP('page-menu');st='MENU'}

function rCL(){
  const list=document.getElementById('ch-list');list.innerHTML='';
  CH.forEach((ch,idx)=>{
    const ul=idx<sv.ul;
    const d=document.createElement('div');d.className='ch-node'+(ul?' active':' locked');
    d.innerHTML=ul?`<div class="ch-icon">${ch.icon}</div><div class="ch-info"><div class="ch-name">${ch.name}</div><div class="ch-desc">${ch.waves.length}波 · 包含BOSS战</div></div>`
      :`<div class="ch-icon">🔒</div><div class="ch-info"><div class="ch-name">${ch.name}</div><div class="ch-desc">通关上一章解锁</div></div>`;
    if(ul)d.addEventListener('click',()=>sG(idx));
    list.appendChild(d);
  });
}

function rUP(){
  document.getElementById('qi-amt').textContent=sv.qi;
  const list=document.getElementById('up-list');list.innerHTML='';
  UPS.forEach(u=>{
    const lv=sv.up[u.id]||0,mx=lv>=u.mx,cst=mx?0:u.cs[lv],can=!mx&&sv.qi>=cst;
    const d=document.createElement('div');d.className='up-item'+(mx?' maxed':'');
    d.innerHTML=`<div class="up-ic">${u.ic}</div><div class="up-inner"><div class="up-nm">${u.nm}</div><div class="up-desc">${u.ds}</div><div class="up-lv">${'▮'.repeat(lv)}${'▯'.repeat(u.mx-lv)}</div></div><div class="up-cost">${mx?'已满':'¥'+cst}</div>`;
    if(!mx&&can){d.addEventListener('click',()=>{sv.qi-=cst;sv.up[u.id]=(sv.up[u.id]||0)+1;svSave(sv);rUP()})}
    list.appendChild(d);
  });
}

// ===== INIT =====
sv=ld();shP('page-story');st='STORY';iPl();
</script>
